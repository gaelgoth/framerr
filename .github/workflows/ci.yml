name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: framerr

env:
  PROJECT: framerr.xcodeproj
  SCHEME: framerr

jobs:
  # Runs here, not in its own workflow: tags created with GITHUB_TOKEN don't trigger other workflows.
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5

  build:
    name: Lint, Test, Build & Package
    needs: release-please
    # Still run on PRs, where release-please is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      dmg_name: ${{ steps.package.outputs.dmg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swiftformat --version
          xcbeautify --version

      - name: Install SwiftLint and create-dmg
        run: brew install swiftlint create-dmg

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Run unit + UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore

      - name: Determine app version
        id: version
        run: |
          VERSION=$(jq -r '."."' ../.release-please-manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: Package DMG
        id: package
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/framerr.app"
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"

          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            NAME="framerr-${{ needs.release-please.outputs.tag_name }}"
          else
            NAME="framerr-${{ steps.version.outputs.version }}-$(git rev-parse --short HEAD)"
          fi
          DMG_PATH="$GITHUB_WORKSPACE/${NAME}.dmg"

          create-dmg \
            --volname "framerr" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "framerr.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "framerr.app" \
            --skip-jenkins \
            "$DMG_PATH" \
            "$STAGE_DIR/" || true

          test -f "$DMG_PATH"
          echo "dmg_name=${NAME}.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.dmg_name }}
          path: ${{ steps.package.outputs.dmg_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.dmg_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ needs.build.outputs.dmg_name }}
          # Keep the changelog notes release-please wrote; add the Gatekeeper note below them.
          append_body: true
          body: |
            **Note:** this build is ad-hoc signed (not notarized). On first launch, Gatekeeper
            will say it's from an "unidentified developer." Right-click (or Control-click) the
            app in `/Applications` and choose **Open**, then confirm — or run:
            `xattr -cr /Applications/framerr.app`
